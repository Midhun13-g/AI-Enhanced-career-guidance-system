spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      minimum-idle: 2
      maximum-pool-size: 5
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 60000
      validation-timeout: 5000
      connection-test-query: SELECT 1
      auto-commit: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        connection:
          provider_disables_autocommit: false

server:
  port: 8080

resume:
  storage-dir: ${RESUME_STORAGE_DIR:uploads/resumes}
  max-size-bytes: 5242880

careerguidance:
  app:
    jwtSecret: ${JWT_SECRET}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}

nlp:
  service:
    url: ${NLP_SERVICE_URL:http://localhost:8000}

# Set GROQ_API_KEY in the backend environment. The browser never receives this key.
groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:llama-3.1-8b-instant}

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    analyze-endpoint: ${AI_SERVICE_ANALYZE_ENDPOINT:/api/resume/analyze}

huggingface:
  space:
    id: ${HF_SPACE_ID:}
    url: ${HF_SPACE_URL:https://midhun-2542-career-guidance-system.hf.space}
    analyze-endpoint: ${HF_ANALYZE_ENDPOINT:/api/resume/analyze}
  token: ${HF_TOKEN:}
  timeout:
    connect-seconds: ${HF_CONNECT_TIMEOUT:15}
    read-seconds: ${HF_READ_TIMEOUT:180}
  retry:
    max-attempts: ${HF_MAX_RETRIES:3}
    backoff-ms: ${HF_RETRY_BACKOFF_MS:2000}
